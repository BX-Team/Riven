name: PR check

on:
  pull_request:
    branches: ["master"]

permissions: {}

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  check:
    name: Lint & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: blacksmith-4vcpu-ubuntu-2404
          - name: windows
            os: blacksmith-8vcpu-windows-2025
          - name: macos
            os: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.name }}

      - name: Install the GUI system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libvulkan1 libasound2-dev

      - name: Lint with clippy (gui + cli)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint with clippy (cli only)
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features cli -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check the flake and build the mini-pack checks
        run: nix flake check -L

  gate:
    name: PR check
    if: ${{ always() }}
    needs: [format, check, nix]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'upstream results: %s\n' "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) exit 1 ;;
          esac
