[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["BX Team"]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/BX-Team/Riven"
repository = "https://github.com/BX-Team/Riven"

[workspace.dependencies]
riven-build = { path = "crates/riven-build" }
riven-format = { path = "crates/riven-format" }
riven-resolve = { path = "crates/riven-resolve" }
riven-sources = { path = "crates/riven-sources" }
riven-sync = { path = "crates/riven-sync" }
dirs = "7"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[package]
name = "riven"
description = "Riven Launcher — Minecraft launcher and modpack toolkit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "riven_lib"
crate-type = ["rlib"]

[features]
default = ["gui", "cli"]
gui = []
cli = ["dep:clap", "dep:indicatif", "dep:console"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
console = { version = "0.16", optional = true }
futures-util.workspace = true
indicatif = { version = "0.18", optional = true }
reqwest.workspace = true
riven-build.workspace = true
riven-format.workspace = true
riven-resolve.workspace = true
riven-sources.workspace = true
riven-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
