[workspace]
members = ["crates/*"]
exclude = ["patches/*"]

[workspace.package]
version = "0.1.0"
authors = ["BX Team"]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/BX-Team/Riven"
repository = "https://github.com/BX-Team/Riven"

[workspace.dependencies]
riven-build = { path = "crates/riven-build" }
riven-format = { path = "crates/riven-format" }
riven-launch = { path = "crates/riven-launch" }
riven-resolve = { path = "crates/riven-resolve" }
riven-sources = { path = "crates/riven-sources" }
riven-sync = { path = "crates/riven-sync" }
base64 = "0.23"
dirs = "7"
dunce = "1"
ed25519-dalek = "3"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
lighty-launch = "26.9"
lighty-launcher = { version = "26.9", features = ["vanilla", "fabric", "quilt", "neoforge", "forge", "events", "tracing"] }
percent-encoding = "2"
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[package]
name = "riven"
description = "Riven Launcher — Minecraft launcher and modpack toolkit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

# gpui and its layout engine are too slow unoptimized to judge the UI by; our crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "riven_lib"
crate-type = ["rlib"]

[features]
default = ["gui", "cli"]
gui = ["dep:gpui-kit", "dep:image", "dep:notify", "dep:rust-i18n", "dep:sys-locale"]
cli = ["dep:clap", "dep:indicatif", "dep:console"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
console = { version = "0.16", optional = true }
dirs.workspace = true
futures-util.workspace = true
gpui-kit = { version = "=0.7.1", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }
indicatif = { version = "0.18", optional = true }
notify = { version = "8", optional = true }
percent-encoding.workspace = true
reqwest.workspace = true
rust-i18n = { version = "4", optional = true }
riven-build.workspace = true
riven-format.workspace = true
riven-launch.workspace = true
riven-resolve.workspace = true
riven-sources.workspace = true
riven-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = { version = "0.3", optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "riven"
maintainer = "BX Team"
copyright = "BX Team, GPL-3.0-or-later"
license-file = ["LICENSE", "0"]
extended-description = "Minecraft launcher with its own modpack format: install and update packs by link, author them from the CLI or the developer section."
section = "games"
priority = "optional"
depends = "$auto, libvulkan1, libwayland-client0, libxkbcommon-x11-0"
recommends = "git"
assets = [
    ["target/release/riven", "usr/bin/", "755"],
    ["packaging/linux/riven.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/riven-mime.xml", "usr/share/mime/packages/riven.xml", "644"],
    ["assets/brand/riven.svg", "usr/share/icons/hicolor/scalable/apps/riven.svg", "644"],
    ["assets/brand/riven-512.png", "usr/share/icons/hicolor/512x512/apps/riven.png", "644"],
]

[package.metadata.generate-rpm]
name = "riven"
summary = "Minecraft launcher and modpack toolkit"
assets = [
    { source = "target/release/riven", dest = "/usr/bin/riven", mode = "755" },
    { source = "packaging/linux/riven.desktop", dest = "/usr/share/applications/riven.desktop", mode = "644" },
    { source = "packaging/linux/riven-mime.xml", dest = "/usr/share/mime/packages/riven.xml", mode = "644" },
    { source = "assets/brand/riven.svg", dest = "/usr/share/icons/hicolor/scalable/apps/riven.svg", mode = "644" },
    { source = "assets/brand/riven-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/riven.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libwayland-client = "*"
vulkan-loader = "*"

# Hides Forge/NeoForge processor consoles on Windows and adds game wrapper commands (MangoHud, GameMode).
[patch.crates-io]
lighty-launch = { path = "patches/lighty-launch" }
